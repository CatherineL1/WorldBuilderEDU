<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>WorldBuilder Lite – Study & Build</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root{--glow:#00f2ff;--dark:#0a0a0a;--light:#fff;--accent:#ff00c1;}
    *{box-sizing:border-box;font-family:Segoe UI,Arial,sans-serif;}
    body{margin:0;background:var(--dark);color:var(--light);display:flex;flex-direction:column;align-items:center;}
    header{width:100%;padding:1rem;text-align:center;background:#111;}
    #stats{display:flex;gap:1.5rem;justify-content:center;margin-top:.5rem;font-weight:bold;}
    .stat{color:var(--glow);}
    main{width:100%;max-width:700px;padding:1rem;}
    .screen{display:none;}
    .active{display:block;}
    h2{margin-top:0;}
    .btn{background:var(--glow);color:var(--dark);padding:.6rem 1rem;border:none;border-radius:4px;cursor:pointer;font-weight:bold;box-shadow:0 0 10px var(--glow);}
    .btn:disabled{opacity:.4;cursor:not-allowed;}
    .choice{display:block;width:100%;margin:.5rem 0;padding:.7rem;background:#222;border:1px solid #444;border-radius:6px;cursor:pointer;}
    .choice:hover{background:#333;}
    #cityGrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:1rem;}
    .cell{width:100%;aspect-ratio:1/1;background:#1a1a1a;border:1px solid #333;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:1.6rem;cursor:pointer;}
    .house{background:radial-gradient(circle,#4caf50 40%,#2e7d32);}
    .building{background:radial-gradient(circle,#2196f3 40%,#1565c0);}
    .park{background:radial-gradient(circle,#66bb6a 40%,#388e3c);}
    .school{background:radial-gradient(circle,#ff9800 40%,#ef6c00);}
    .statue{background:radial-gradient(circle,#ff00c1 40%,#880e4f);}
    .correct{animation:pop .4s;}
    @keyframes pop{50%{transform:scale(1.15);color:var(--glow);}}
    #cert{display:none;background:#fff;color:#000;padding:2rem;text-align:center;border:10px solid var(--glow);}
  </style>
</head>
<body>

<header>
  <h1>WorldBuilder Lite</h1>
  <div id="stats">
    <div>Level <span class="stat" id="level">1</span></div>
    <div>Energy <span class="stat" id="energy">50</span></div>
    <div>Crystals <span class="stat" id="crystals">0</span></div>
  </div>
</header>

<main>
  <!-- QUEST SCREEN -->
  <div id="questScreen" class="screen active">
    <h2 id="subject">Math</h2>
    <p id="question">Loading question...</p>
    <div id="choices"></div>
    <p id="feedback"></p>
    <button class="btn" id="nextBtn" style="display:none;">Next</button>
  </div>

  <!-- CITY BUILDER STORE -->
  <div id="storeScreen" class="screen">
    <h2>City Builder Store</h2>
    <p>Click an item and then click an empty city tile to build.</p>
    <div style="display:flex;gap:1rem;flex-wrap:wrap;margin-bottom:1rem;">
      <button class="btn storeBtn" data-item="house" data-cost="15" data-energy="10">House 15💎</button>
      <button class="btn storeBtn" data-item="building" data-cost="20" data-energy="10">Building 20💎</button>
      <button class="btn storeBtn" data-item="park" data-cost="35" data-energy="10">Park 35💎</button>
      <button class="btn storeBtn" data-item="school" data-cost="50" data-energy="10">School 50💎</button>
      <button class="btn storeBtn" data-item="statue" data-cost="99" data-energy="10">Statue 99💎</button>
    </div>
    <div id="cityGrid"></div>
    <button class="btn" id="backToQuest">Back to Questions</button>
  </div>

  <!-- CERTIFICATE -->
  <div id="cert">
    <h1>🏆 CONGRATULATIONS 🏆</h1>
    <h2>You reached Level 30!</h2>
    <p>You are officially a WorldBuilder Master.</p>
    <button class="btn" onclick="window.print()">Print Certificate</button>
  </div>
</main>

<script>
/* ========== ON-THE-FLY QUESTION GENERATOR ========== */
const usedHashes=new Set();
function hash(str){return str.split('').reduce((a,c)=>((a<<5)-a+c.charCodeAt(0))&a,0);}
function rng(seed){const s=Math.sin(seed)*10000;return s-Math.floor(s);}
function rand(min,max){return Math.floor(Math.random()*(max-min+1))+min;}
function randItem(arr){return arr[Math.floor(Math.random()*arr.length)];}
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function roundChoices(n){const correct=Math.round(n);return shuffle([correct,correct+rand(1,5),correct-rand(1,5),correct+rand(6,9)]);}

function makeQuestion(level){
  const subjects=['math','science','history','coding','art'];
  const subject=subjects[(level-1)%subjects.length];
  const diff=level;
  let qObj,h;
  do{
    qObj=generateBySubject(subject,diff);
    h=hash(JSON.stringify(qObj));
  }while(usedHashes.has(h));
  usedHashes.add(h);
  return qObj;
}
function generateBySubject(subj,d){
  switch(subj){
    case 'math': return mathQ(d);
    case 'science': return scienceQ(d);
    case 'history': return historyQ(d);
    case 'coding': return codingQ(d);
    case 'art': return artQ(d);
  }
}
/* ------------- subject generators ------------- */
function mathQ(d){
  if(d<=5){
    const a=rand(2,9),b=rand(2,9),op=randItem(['+','-','×']);
    const ans=op==='+'?a+b:op==='-'?a-b:a*b;
    return {q:`${a} ${op} ${b} = ?`,a:shuffle([ans,ans+rand(1,3),ans-rand(1,3),ans+rand(4,6)]),c:0};
  }
  if(d<=10){
    const a=rand(2,6),x=rand(1,9),c=a*x+rand(2,8);
    return {q:`Solve  ${a}x + ${c-a*x} = ${c}`,a:[`x=${x-2}`,`x=${x}`,`x=${x+2}`,`x=${x+4}`],c:1};
  }
  if(d<=15){
    const r=rand(3,12),area=Math.PI*r*r;
    return {q:`Area of circle with radius ${r} (round to nearest whole)`,a:roundChoices(area),c:0};
  }
  if(d<=20){
    const x1=rand(-5,5),x2=rand(-5,5),a=1;
    const b=-(x1+x2),c=x1*x2;
    return {q:`Factor  x² ${b>=0?'+':''} ${b}x ${c>=0?'+':''} ${c}`,a:[`(x${-x1>=0?'+':''}${-x1})(x${-x2>=0?'+':''}${-x2})`,`(x+2)(x+3)`,`(x+1)(x+6)`,`(x-4)(x+9)`],c:0};
  }
  const coeff=rand(2,7),pow=rand(2,5);
  return {q:`Derivative of  ${coeff}x^${pow}`,a
