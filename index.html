<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>WorldBuilder Lite – Study & Build</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root{--glow:#00f2ff;--dark:#0a0a0a;--light:#fff;--accent:#ff00c1;}
    *{box-sizing:border-box;font-family:Segoe UI,Arial,sans-serif;}
    body{margin:0;background:var(--dark);color:var(--light);display:flex;flex-direction:column;align-items:center;}
    header{width:100%;padding:1rem;text-align:center;background:#111;}
    #stats{display:flex;gap:1.5rem;justify-content:center;margin-top:.5rem;font-weight:bold;}
    .stat{color:var(--glow);}
    main{width:100%;max-width:700px;padding:1rem;}
    .screen{display:none;}
    .active{display:block;}
    h2{margin-top:0;}
    .btn{background:var(--glow);color:var(--dark);padding:.6rem 1rem;border:none;border-radius:4px;cursor:pointer;font-weight:bold;box-shadow:0 0 10px var(--glow);}
    .btn:disabled{opacity:.4;cursor:not-allowed;}
    .choice{display:block;width:100%;margin:.5rem 0;padding:.7rem;background:#222;border:1px solid #444;border-radius:6px;cursor:pointer;}
    .choice:hover{background:#333;}
    #cityGrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:1rem;}
    .cell{width:100%;aspect-ratio:1/1;background:#1a1a1a;border:1px solid #333;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:1.6rem;cursor:pointer;}
    .house{background:radial-gradient(circle,#4caf50 40%,#2e7d32);}
    .building{background:radial-gradient(circle,#2196f3 40%,#1565c0);}
    .park{background:radial-gradient(circle,#66bb6a 40%,#388e3c);}
    .school{background:radial-gradient(circle,#ff9800 40%,#ef6c00);}
    .statue{background:radial-gradient(circle,#ff00c1 40%,#880e4f);}
    .correct{animation:pop .4s;}
    @keyframes pop{50%{transform:scale(1.15);color:var(--glow);}}
    #cert{display:none;background:#fff;color:#000;padding:2rem;text-align:center;border:10px solid var(--glow);}
  </style>
</head>
<body>

<header>
  <h1>WorldBuilder Lite</h1>
  <div id="stats">
    <div>Level <span class="stat" id="level">1</span></div>
    <div>Energy <span class="stat" id="energy">50</span></div>
    <div>Crystals <span class="stat" id="crystals">0</span></div>
  </div>
</header>

<main>
  <!-- ========= QUEST SCREEN ========= -->
  <div id="questScreen" class="screen active">
    <h2 id="subject">Math</h2>
    <p id="question">Loading question...</p>
    <div id="choices"></div>
    <p id="feedback"></p>
    <button class="btn" id="nextBtn" style="display:none;">Next</button>
  </div>

  <!-- ========= CITY BUILDER STORE ========= -->
  <div id="storeScreen" class="screen">
    <h2>City Builder Store</h2>
    <p>Click an item and then click an empty city tile to build.</p>
    <div style="display:flex;gap:1rem;flex-wrap:wrap;margin-bottom:1rem;">
      <button class="btn storeBtn" data-item="house" data-cost="15" data-energy="10">House 15💎</button>
      <button class="btn storeBtn" data-item="building" data-cost="20" data-energy="10">Building 20💎</button>
      <button class="btn storeBtn" data-item="park" data-cost="35" data-energy="10">Park 35💎</button>
      <button class="btn storeBtn" data-item="school" data-cost="50" data-energy="10">School 50💎</button>
      <button class="btn storeBtn" data-item="statue" data-cost="99" data-energy="10">Statue 99💎</button>
    </div>
    <div id="cityGrid"></div>
    <button class="btn" id="backToQuest">Back to Questions</button>
  </div>

  <!-- ========= CERTIFICATE ========= -->
  <div id="cert">
    <h1>🏆 CONGRATULATIONS 🏆</h1>
    <h2>You reached Level 30!</h2>
    <p>You are officially a WorldBuilder Master.</p>
    <button class="btn" onclick="window.print()">Print Certificate</button>
  </div>
</main>

/* ====== STATE ====== */
let level=1,energy=50,crystals=0,currentQ=null,selectedItem=null;
const MAX_LEVEL=30;
const subjects=['math','science','history','coding','art'];

/* ====== DOM ====== */
const qs=document.getElementById('questScreen');
const ss=document.getElementById('storeScreen');
const qEl=document.getElementById('question');
const choicesEl=document.getElementById('choices');
const feedbackEl=document.getElementById('feedback');
const nextBtn=document.getElementById('nextBtn');
const cityGrid=document.getElementById('cityGrid');

/* ====== INIT ====== */
document.getElementById('level').textContent=level;
document.getElementById('energy').textContent=energy;
document.getElementById('crystals').textContent=crystals;
loadQuestion();
buildGrid();
bindStore();

/* ====== QUEST LOGIC ====== */
function loadQuestion(){
  const subject=subjects[(level-1)%subjects.length];
  const list=bank[subject];
  currentQ=list[(level-1)%list.length];
  document.getElementById('subject').textContent=subject.charAt(0).toUpperCase()+subject.slice(1);
  qEl.textContent=currentQ.q;
  choicesEl.innerHTML='';
  currentQ.a.forEach((ans,i)=>{
    const btn=document.createElement('button');
    btn.className='choice';
    btn.textContent=String.fromCharCode(65+i)+') '+ans;
    btn.onclick=()=>checkAnswer(i);
    choicesEl.appendChild(btn);
  });
  feedbackEl.textContent='';
  nextBtn.style.display='none';
}
function checkAnswer(idx){
  const correct=idx===currentQ.c;
  if(correct){
    energy+=10;crystals+=5;
    feedbackEl.textContent='✅ Correct! +10 Energy +5 Crystals';
    feedbackEl.className='correct';
  }else{
    energy=Math.max(0,energy-5);
    feedbackEl.textContent=`❌ Wrong. The answer was ${String.fromCharCode(65+currentQ.c)}) ${currentQ.a[currentQ.c]}`;
    feedbackEl.className='';
  }
  updateHUD();
  Array.from(choicesEl.children).forEach(b=>b.disabled=true);
  nextBtn.style.display='inline-block';
}
nextBtn.onclick=()=>{
  if(level>=MAX_LEVEL){showCert();return;}
  level++;energy=Math.min(energy+5,999); //bonus energy each level
  updateHUD();
  loadQuestion();
};

/* ====== CITY BUILDER ====== */
function buildGrid(){
  cityGrid.innerHTML='';
  for(let i=0;i<36;i++){
    const cell=document.createElement('div');
    cell.className='cell';
    cell.dataset.index=i;
    cell.onclick=()=>placeItem(cell);
    cityGrid.appendChild(cell);
  }
}
function bindStore(){
  document.querySelectorAll('.storeBtn').forEach(btn=>{
    btn.onclick=()=>{
      selectedItem={type:btn.dataset.item,cost:+btn.dataset.cost,energy:+btn.dataset.energy};
      document.querySelectorAll('.storeBtn').forEach(b=>b.style.boxShadow='');
      btn.style.boxShadow='0 0 15px var(--glow)';
    };
  });
}
function placeItem(cell){
  if(!selectedItem){alert('Pick an item in the store first.');return;}
  if(cell.classList.length>1){alert('Tile occupied.');return;}
  if(crystals<selectedItem.cost){alert('Not enough crystals.');return;}
  if(energy<selectedItem.energy){alert('Not enough energy.');return;}
  crystals-=selectedItem.cost;
  energy-=selectedItem.energy;
  cell.classList.add(selectedItem.type);
  cell.textContent={house:'🏠',building:'🏢',park:'🌳',school:'🏫',statue:'🗿'}[selectedItem.type];
  updateHUD();
}
document.getElementById('backToQuest').onclick=()=>{
  qs.classList.add('active');ss.classList.remove('active');
};

/* ====== NAV ====== */
function updateHUD(){
  document.getElementById('level').textContent=level;
  document.getElementById('energy').textContent=energy;
  document.getElementById('crystals').textContent=crystals;
  if(level>=2){
    document.getElementById('storeBtn')?.remove(); //only add once
    const storeBtn=document.createElement('button');
    storeBtn.id='storeBtn';storeBtn.className='btn';storeBtn.textContent='City Builder';
    storeBtn.onclick=()=>{qs.classList.remove('active');ss.classList.add('active');};
    document.querySelector('header').appendChild(storeBtn);
  }
}
function showCert(){
  qs.style.display=ss.style.display='none';
  document.getElementById('cert').style.display='block';
}
</script>
