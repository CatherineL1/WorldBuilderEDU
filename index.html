<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduCity - Learn & Build Your World</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Exo 2', sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a3e 50%, #2d1b69 100%);
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        /* Homepage Styles */
        .homepage {
            text-align: center;
            padding: 50px 0;
            position: relative;
        }
        
        .homepage::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="20" cy="20" r="2" fill="%23fff" opacity="0.1"/><circle cx="80" cy="40" r="1" fill="%23fff" opacity="0.1"/><circle cx="40" cy="80" r="1.5" fill="%23fff" opacity="0.1"/></svg>');
            animation: float 20s infinite linear;
        }
        
        @keyframes float {
            0% { transform: translateY(0); }
            100% { transform: translateY(-100px); }
        }
        
        .logo {
            font-family: 'Orbitron', monospace;
            font-size: 4rem;
            font-weight: 900;
            background: linear-gradient(45deg, #00ff88, #00ccff, #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
            animation: glow 2s ease-in-out infinite alternate;
        }
        
        @keyframes glow {
            from { filter: drop-shadow(0 0 20px rgba(0, 255, 136, 0.5)); }
            to { filter: drop-shadow(0 0 30px rgba(0, 204, 255, 0.8)); }
        }
        
        .tagline {
            font-size: 1.5rem;
            color: #00ff88;
            margin-bottom: 40px;
            font-weight: 300;
        }
        
        .stats-bar {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            margin: 30px auto;
            max-width: 600px;
            display: flex;
            justify-content: space-around;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .stat {
            text-align: center;
        }
        
        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: #00ff88;
        }
        
        .stat-label {
            font-size: 0.9rem;
            color: #aaa;
            margin-top: 5px;
        }
        
        .button-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 40px;
        }
        
        .main-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 25px;
            border-radius: 20px;
            color: white;
            font-size: 1.3rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .main-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }
        
        .main-button:hover::before {
            left: 100%;
        }
        
        .main-button:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.5);
        }
        
        .main-button.math { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
        .main-button.science { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
        .main-button.history { background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); }
        .main-button.coding { background: linear-gradient(135deg, #fa709a 0%, #fee140 100%); }
        .main-button.art { background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%); }
        .main-button.city { background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%); }
        
        /* Question Page Styles */
        .question-page {
            display: none;
            padding: 40px 0;
        }
        
        .level-indicator {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px 30px;
            border-radius: 30px;
            display: inline-block;
            margin-bottom: 30px;
            border: 2px solid #00ff88;
        }
        
        .level-text {
            font-size: 1.2rem;
            color: #00ff88;
            font-weight: 600;
        }
        
        .question-box {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            margin: 20px 0;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .question-text {
            font-size: 1.5rem;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        
        .options {
            display: grid;
            gap: 15px;
        }
        
        .option-button {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            padding: 20px;
            border-radius: 15px;
            color: white;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
        }
        
        .option-button:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: #00ff88;
            transform: translateX(10px);
        }
        
        .option-button.correct {
            background: rgba(0, 255, 136, 0.3);
            border-color: #00ff88;
        }
        
        .option-button.incorrect {
            background: rgba(255, 0, 100, 0.3);
            border-color: #ff0064;
        }
        
        .feedback {
            margin-top: 20px;
            padding: 20px;
            border-radius: 15px;
            font-size: 1.1rem;
            display: none;
        }
        
        .feedback.correct {
            background: rgba(0, 255, 136, 0.2);
            border: 2px solid #00ff88;
            color: #00ff88;
        }
        
        .feedback.incorrect {
            background: rgba(255, 0, 100, 0.2);
            border: 2px solid #ff0064;
            color: #ff0064;
        }
        
        /* City Builder Styles */
        .city-builder {
            display: none;
            padding: 40px 0;
        }
        
        .builder-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        
        .store-button {
            background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%);
            color: #333;
            border: none;
            padding: 15px 30px;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .store-button:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(255, 215, 0, 0.5);
        }
        
        .city-canvas {
            width: 100%;
            height: 500px;
            background: linear-gradient(to bottom, #87CEEB 0%, #98D8C8 50%, #7FFF00 50%, #228B22 100%);
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            border: 3px solid rgba(255, 255, 255, 0.3);
        }
        
        .building {
            position: absolute;
            cursor: move;
            transition: transform 0.3s ease;
        }
        
        .building:hover {
            transform: scale(1.1);
        }
        
        .grid-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                repeating-linear-gradient(0deg, transparent, transparent 49px, rgba(255,255,255,0.1) 49px, rgba(255,255,255,0.1) 50px),
                repeating-linear-gradient(90deg, transparent, transparent 49px, rgba(255,255,255,0.1) 49px, rgba(255,255,255,0.1) 50px);
            pointer-events: none;
        }
        
        /* Store Modal */
        .store-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            z-index: 1000;
        }
        
        .store-content {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            max-width: 800px;
            margin: 50px auto;
            padding: 40px;
            border-radius: 20px;
            max-height: 80vh;
            overflow-y: auto;
        }
        
        .store-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        
        .store-item {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            border: 2px solid transparent;
        }
        
        .store-item:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: #00ff88;
            transform: translateY(-5px);
        }
        
        .item-icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }
        
        .item-name {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        .item-cost {
            color: #ffd700;
            font-size: 1rem;
        }
        
        .close-button {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            font-size: 2rem;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .close-button:hover {
            background: rgba(255, 0, 100, 0.5);
            transform: rotate(90deg);
        }
        
        /* Back Button */
        .back-button {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }
        
        .back-button:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateX(-5px);
        }
        
        /* Animations */
        @keyframes slideIn {
            from { transform: translateX(-100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        
        .page-active {
            display: block;
            animation: fadeIn 0.5s ease;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .logo { font-size: 3rem; }
            .button-grid { grid-template-columns: 1fr; }
            .city-canvas { height: 300px; }
            .store-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Homepage -->
        <div id="homepage" class="homepage">
            <h1 class="logo">EduCity</h1>
            <p class="tagline">Learn. Build. Conquer.</p>
            
            <div class="stats-bar">
                <div class="stat">
                    <div class="stat-value" id="energy">0</div>
                    <div class="stat-label">Energy Points</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="crystals">0</div>
                    <div class="stat-label">Crystals</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="buildings">0</div>
                    <div class="stat-label">Buildings</div>
                </div>
            </div>
            
            <div class="button-grid">
                <button class="main-button math" onclick="showSubject('math')">
                    🧮 Mathematics
                </button>
                <button class="main-button science" onclick="showSubject('science')">
                    🔬 Science
                </button>
                <button class="main-button history" onclick="showSubject('history')">
                    📚 History
                </button>
                <button class="main-button coding" onclick="showSubject('coding')">
                    💻 Coding
                </button>
                <button class="main-button art" onclick="showSubject('art')">
                    🎨 Art
                </button>
                <button class="main-button city" onclick="showCityBuilder()">
                    🏙️ City Builder
                </button>
            </div>
        </div>
        
        <!-- Question Page -->
        <div id="questionPage" class="question-page">
            <button class="back-button" onclick="showHomepage()">← Back to Home</button>
            <div class="level-indicator">
                <span class="level-text" id="levelText">Level 1 - Mathematics</span>
            </div>
            <div class="question-box">
                <div class="question-text" id="questionText">Loading question...</div>
                <div class="options" id="optionsContainer"></div>
                <div class="feedback" id="feedback"></div>
            </div>
        </div>
        
        <!-- City Builder -->
        <div id="cityBuilder" class="city-builder">
            <button class="back-button" onclick="showHomepage()">← Back to Home</button>
            <div class="builder-header">
                <h2>Your City</h2>
                <button class="store-button" onclick="openStore()">🏪 City Store</button>
            </div>
            <div class="city-canvas" id="cityCanvas">
                <div class="grid-overlay"></div>
            </div>
        </div>
        
        <!-- Store Modal -->
        <div id="storeModal" class="store-modal">
            <div class="store-content">
                <button class="close-button" onclick="closeStore()">×</button>
                <h2>City Store</h2>
                <div class="store-grid" id="storeGrid"></div>
            </div>
        </div>
    </div>

        // Store Items
        const storeItems = [
            { name: "House", icon: "🏠", cost: 15, type: "house" },
            { name: "Apartment", icon: "🏢", cost: 25, type: "building" },
            { name: "School", icon: "🏫", cost: 30, type: "building" },
            { name: "Hospital", icon: "🏥", cost: 35, type: "building" },
            { name: "Shop", icon: "🏪", cost: 20, type: "building" },
            { name: "Park", icon: "🌳", cost: 18, type: "decoration" },
            { name: "Library", icon: "📚", cost: 28, type: "building" },
            { name: "Stadium", icon: "🏟️", cost: 40, type: "building" },
            { name: "Restaurant", icon: "🍽️", cost: 22, type: "building" },
            { name: "Bank", icon: "🏦", cost: 32, type: "building" }
        ];
        
        // Initialize game
        function init() {
            loadGameState();
            updateStats();
            initializeCity();
        }
        
        // Load/Save game state
        function loadGameState() {
            const saved = localStorage.getItem('eduCityState');
            if (saved) {
                gameState = JSON.parse(saved);
            }
        }
        
        function saveGameState() {
            localStorage.setItem('eduCityState', JSON.stringify(gameState));
        }
        
        // Navigation
        function showHomepage() {
            document.querySelectorAll('.homepage, .question-page, .city-builder').forEach(page => {
                page.classList.remove('page-active');
                page.style.display = 'none';
            });
            document.getElementById('homepage').style.display = 'block';
            document.getElementById('homepage').classList.add('page-active');
        }
        
        function showSubject(subject) {
            gameState.currentSubject = subject;
            gameState.currentLevel = 1;
            loadQuestion();
            
            document.querySelectorAll('.homepage, .question-page, .city-builder').forEach(page => {
                page.classList.remove('page-active');
                page.style.display = 'none';
            });
            document.getElementById('questionPage').style.display = 'block';
            document.getElementById('questionPage').classList.add('page-active');
        }
        
        function showCityBuilder() {
            document.querySelectorAll('.homepage, .question-page, .city-builder').forEach(page => {
                page.classList.remove('page-active');
                page.style.display = 'none';
            });
            document.getElementById('cityBuilder').style.display = 'block';
            document.getElementById('cityBuilder').classList.add('page-active');
        }
        
        // Question System
        function loadQuestion() {
            const subjectQuestions = questions[gameState.currentSubject];
            const levelQuestions = subjectQuestions.filter(q => q.level === gameState.currentLevel);
            
            if (levelQuestions.length === 0) {
                // Level up
                gameState.currentLevel++;
                if (gameState.currentLevel > 10) {
                    alert('Congratulations! You completed this subject!');
                    showHomepage();
                    return;
                }
                loadQuestion();
                return;
            }
            
            const randomQuestion = levelQuestions[Math.floor(Math.random() * levelQuestions.length)];
            
            document.getElementById('levelText').textContent = `Level ${gameState.currentLevel} - ${gameState.currentSubject.charAt(0).toUpperCase() + gameState.currentSubject.slice(1)}`;
            document.getElementById('questionText').textContent = randomQuestion.question;
            
            const optionsContainer = document.getElementById('optionsContainer');
            optionsContainer.innerHTML = '';
            
            randomQuestion.options.forEach((option, index) => {
                const button = document.createElement('button');
                button.className = 'option-button';
                button.textContent = option;
                button.onclick = () => checkAnswer(index, randomQuestion.correct);
                optionsContainer.appendChild(button);
            });
            
            document.getElementById('feedback').style.display = 'none';
        }
        
        function checkAnswer(selected, correct) {
            const buttons = document.querySelectorAll('.option-button');
            const feedback = document.getElementById('feedback');
            
            buttons.forEach(btn => btn.onclick = null);
            
            if (selected === correct) {
                buttons[selected].classList.add('correct');
                feedback.className = 'feedback correct';
                feedback.textContent = 'Correct! +10 Energy Points, +5 Crystals';
                feedback.style.display = 'block';
                
                gameState.energy += 10;
                gameState.crystals += 5;
                updateStats();
                saveGameState();
                
                setTimeout(() => {
                    loadQuestion();
                }, 2000);
            } else {
                buttons[selected].classList.add('incorrect');
                buttons[correct].classList.add('correct');
                feedback.className = 'feedback incorrect';
                feedback.textContent = 'Incorrect. Try again!';
                feedback.style.display = 'block';
                
                setTimeout(() => {
                    loadQuestion();
                }, 2000);
            }
        }
        
        // Stats Update
        function updateStats() {
            document.getElementById('energy').textContent = gameState.energy;
            document.getElementById('crystals').textContent = gameState.crystals;
            document.getElementById('buildings').textContent = gameState.buildings;
        }
        
        // City Builder
        function initializeCity() {
            const canvas = document.getElementById('cityCanvas');
            // Load existing buildings if any
            gameState.unlockedBuildings.forEach(building => {
                placeBuilding(building.type, building.x, building.y, false);
            });
        }
        
        function openStore() {
            const storeGrid = document.getElementById('storeGrid');
            storeGrid.innerHTML = '';
            
            storeItems.forEach(item => {
                const storeItem = document.createElement('div');
                storeItem.className = 'store-item';
                storeItem.innerHTML = `
                    <div class="item-icon">${item.icon}</div>
                    <div class="item-name">${item.name}</div>
                    <div class="item-cost">${item.cost} Crystals</div>
                `;
                
                if (gameState.crystals >= item.cost) {
                    storeItem.onclick = () => purchaseItem(item);
                } else {
                    storeItem.style.opacity = '0.5';
                    storeItem.style.cursor = 'not-allowed';
                }
                
                storeGrid.appendChild(storeItem);
            });
            
            document.getElementById('storeModal').style.display = 'block';
        }
        
        function closeStore() {
            document.getElementById('storeModal').style.display = 'none';
        }
        
        function purchaseItem(item) {
            if (gameState.crystals >= item.cost) {
                gameState.crystals -= item.cost;
                updateStats();
                saveGameState();
                
                // Place the building in the city
                const canvas = document.getElementById('cityCanvas');
                const x = Math.random() * (canvas.offsetWidth - 100);
                const y = Math.random() * (canvas.offsetHeight - 100);
                
                placeBuilding(item.type, x, y, true);
                closeStore();
            }
        }
        
        function placeBuilding(type, x, y, save) {
            const building = document.createElement('div');
            building.className = 'building';
            building.style.left = x + 'px';
            building.style.top = y + 'px';
            building.style.fontSize = '3rem';
            building.style.cursor = 'move';
            
            const item = storeItems.find(i => i.type === type);
            building.textContent = item ? item.icon : '🏠';
            
            // Make draggable
            let isDragging = false;
            let startX, startY, initialX, initialY;
            
            building.addEventListener('mousedown', (e) => {
                isDragging = true;
                startX = e.clientX;
                startY = e.clientY;
                initialX = building.offsetLeft;
                initialY = building.offsetTop;
                building.style.zIndex = '1000';
            });
            
            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;
                
                building.style.left = (initialX + dx) + 'px';
                building.style.top = (initialY + dy) + 'px';
            });
            
            document.addEventListener('mouseup', () => {
                if (isDragging) {
                    isDragging = false;
                    building.style.zIndex = '1';
                    
                    if (save) {
                        // Save building position
                        gameState.unlockedBuildings.push({
                            type: type,
                            x: building.offsetLeft,
                            y: building.offsetTop
                        });
                        gameState.buildings++;
                        updateStats();
                        saveGameState();
                    }
                }
            });
            
            document.getElementById('cityCanvas').appendChild(building);
        }
        
        // Initialize on load
        window.onload = init;
    </script>
</body>
</html>
